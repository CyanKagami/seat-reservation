AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: K-Seat - seat reservation backend, data stores and frontend hosting


Resources:
  # ---------------------------------------------------------------
  # Data layer (from your original appTemplate.yml)
  # ---------------------------------------------------------------
  # One bucket for all uploads:
  #   pictures/* and place seat-type WebP files -> public read (used by <img> tags)
  #   all other layout files -> private (only Lambda reads/writes)
  KSeatS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: k-seat-object
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false

  KSeatS3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref KSeatS3Bucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub '${KSeatS3Bucket.Arn}/pictures/*'
          - Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub '${KSeatS3Bucket.Arn}/layouts/place/*/*.webp'

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: users
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: events
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  PlacesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: places
      AttributeDefinitions:
        - AttributeName: placeId
          AttributeType: S
      KeySchema:
        - AttributeName: placeId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  LocationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: locations
      AttributeDefinitions:
        - AttributeName: locationId
          AttributeType: S
      KeySchema:
        - AttributeName: locationId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  ReservationTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: reservations
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
        - AttributeName: seatId
          AttributeType: S
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH
        - AttributeName: seatId
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
