AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 3-Service Lambda Architecture with Express.js

Globals:
  Function:
    Runtime: nodejs20.x
    Architectures:
      - arm64
    MemorySize: 512
    Timeout: 20
    Environment:
      Variables:
        AWS_REGION: us-east-1

Resources:
  # --- Shared layer ---
  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: shared-lib
      ContentUri: layers/shared/
      CompatibleRuntimes:
        - nodejs20.x
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: nodejs20.x

  SharedApiGateway:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Ref FrontendOrigin
        AllowCredentials: true
        AllowMethods:
          - GET
          - POST
          - PATCH
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
      Auth:
        DefaultAuthorizer: JwtLambdaAuthorizer
        Authorizers:
          JwtLambdaAuthorizer:
            FunctionArn: !GetAtt AuthorizerFunction.Arn
            FunctionInvokeRole: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
            AuthorizerPayloadFormatVersion: "2.0"
            EnableSimpleResponses: true
            Identity:
              Headers:
                - Authorization

  AuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: services/core/
      Runtime: nodejs20.x
      Handler: authorizer.handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Layers:
        - !Ref SharedLayer
      Environment:
        Variables:
          JWT_SECRET: !Ref JwtSecret

  AuthServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: services/auth/
      Runtime: nodejs20.x
      Handler: lambda.handler
      Layers:
        - !Ref SharedLayer
      Events:
        AuthApiRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref SharedApiGateway
            Path: /api/auth/{proxy+}
            Method: ANY
            Auth:
              Authorizer: NONE
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Environment:
        Variables:
          JWT_SECRET: !Ref JwtSecret
          GOOGLE_CLIENT_ID: !Ref GoogleClientId
          GOOGLE_CLIENT_SECRET: !Ref GoogleClientSecret
          FRONTEND_ORIGIN: !Ref FrontendOrigin
          AWS_LOCALSTACK_URL: !Ref AwsLocalstackUrl
          API_BASE_URL: !GetAtt SharedApiGateway.ApiEndpoint

  BookingServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: services/booking/
      Runtime: nodejs20.x
      Handler: lambda.handler
      Layers:
        - !Ref SharedLayer
      Events:
        BookingApiRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref SharedApiGateway
            Path: /booking/{proxy+}
            Method: ANY
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Environment:
        Variables:
          JWT_SECRET: !Ref JwtSecret

  CoreApiServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: services/core/
      Runtime: nodejs20.x
      Handler: lambda.handler
      Layers:
        - !Ref SharedLayer
      Events:
        CoreApiRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref SharedApiGateway
            Path: /api/{proxy+}
            Method: ANY
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Environment:
        Variables:
          JWT_SECRET: !Ref JwtSecret
          FRONTEND_ORIGIN: !Ref FrontendOrigin

Parameters:
  JwtSecret:
    Type: String
    NoEcho: true
  GoogleClientId:
    Type: String
  GoogleClientSecret:
    Type: String
    NoEcho: true
  FrontendOrigin:
    Type: String
    Default: "http://localhost:5173"
  AwsLocalstackUrl:
    Type: String
    Default: "http://host.docker.internal:4566"

Outputs:
  ApiEndpoint:
    Description: Base URL for your API Gateway
    Value: !GetAtt SharedApiGateway.ApiEndpoint