AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: K-Seat - seat reservation backend, data stores and frontend hosting

Globals:
  Function:
    Runtime: nodejs20.x
    Architectures:
      - arm64
    Timeout: 10
    MemorySize: 256

Parameters:
  JwtSecret:
    Type: String
    NoEcho: true
  GoogleClientId:
    Type: String
  GoogleClientSecret:
    Type: String
    NoEcho: true
  FrontendOrigin:
    Type: String
    Default: "http://localhost:5173"
  AdminEmails:
    Type: String
    Default: ""
    Description: Comma-separated emails that get the admin role on first login

Resources:
  # ---------------------------------------------------------------
  # Data layer (from your original appTemplate.yml)
  # ---------------------------------------------------------------
  # One bucket for all uploads:
  #   pictures/place/*, pictures/event/*  -> public read (used by <img> tags)
  #   layouts/place/*,  layouts/event/*   -> private (only Lambda reads/writes)
  KSeatS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: k-seat-object
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false

  KSeatS3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref KSeatS3Bucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub '${KSeatS3Bucket.Arn}/pictures/*'

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: users
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: events
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  PlacesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: places
      AttributeDefinitions:
        - AttributeName: placeId
          AttributeType: S
      KeySchema:
        - AttributeName: placeId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  LocationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: locations
      AttributeDefinitions:
        - AttributeName: locationId
          AttributeType: S
      KeySchema:
        - AttributeName: locationId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  ReservationTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: reservations
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
        - AttributeName: seatId
          AttributeType: S
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH
        - AttributeName: seatId
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST

  # ---------------------------------------------------------------
  # Frontend hosting (S3 static website, HTTP only - no CloudFront)
  # ---------------------------------------------------------------
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'seat-reservation-frontend-${AWS::AccountId}'
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'

  # ---------------------------------------------------------------
  # Shared layer + API
  # ---------------------------------------------------------------
  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: shared-lib
      ContentUri: layers/shared/
      CompatibleRuntimes:
        - nodejs20.x
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: nodejs20.x

  SharedApiGateway:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Ref FrontendOrigin
        AllowMethods:
          - GET
          - POST
          - PATCH
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
      Auth:
        DefaultAuthorizer: JwtLambdaAuthorizer
        Authorizers:
          JwtLambdaAuthorizer:
            FunctionArn: !GetAtt AuthorizerFunction.Arn
            FunctionInvokeRole: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
            AuthorizerPayloadFormatVersion: "2.0"
            EnableSimpleResponses: true
            Identity:
              Headers:
                - Authorization

  AuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: services/core/
      Runtime: nodejs20.x
      Handler: authorizer.handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Layers:
        - !Ref SharedLayer
      Environment:
        Variables:
          JWT_SECRET: !Ref JwtSecret

  AuthServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: services/auth/
      Runtime: nodejs20.x
      Handler: lambda.handler
      Layers:
        - !Ref SharedLayer
      Events:
        AuthApiRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref SharedApiGateway
            Path: /api/auth/{proxy+}
            Method: ANY
            Auth:
              Authorizer: NONE
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Environment:
        Variables:
          JWT_SECRET: !Ref JwtSecret
          GOOGLE_CLIENT_ID: !Ref GoogleClientId
          GOOGLE_CLIENT_SECRET: !Ref GoogleClientSecret
          FRONTEND_ORIGIN: !Ref FrontendOrigin
          ADMIN_EMAILS: !Ref AdminEmails

  BookingServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: services/booking/
      Runtime: nodejs20.x
      Handler: lambda.handler
      Layers:
        - !Ref SharedLayer
      Events:
        BookingApiRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref SharedApiGateway
            Path: /api/booking/{proxy+}
            Method: ANY
        BookingApiPreflight:
          Type: HttpApi
          Properties:
            ApiId: !Ref SharedApiGateway
            Path: /api/booking/{proxy+}
            Method: OPTIONS
            Auth:
              Authorizer: NONE
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Environment:
        Variables:
          JWT_SECRET: !Ref JwtSecret
          S3_BUCKET: !Ref KSeatS3Bucket

  CoreApiServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: services/core/
      Runtime: nodejs20.x
      Handler: lambda.handler
      Layers:
        - !Ref SharedLayer
      Events:
        CoreApiRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref SharedApiGateway
            Path: /api/{proxy+}
            Method: ANY
        CoreApiPreflight:
          Type: HttpApi
          Properties:
            ApiId: !Ref SharedApiGateway
            Path: /api/{proxy+}
            Method: OPTIONS
            Auth:
              Authorizer: NONE
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Environment:
        Variables:
          JWT_SECRET: !Ref JwtSecret
          FRONTEND_ORIGIN: !Ref FrontendOrigin
          S3_BUCKET: !Ref KSeatS3Bucket

Outputs:
  ApiEndpoint:
    Description: Base URL for the API
    Value: !GetAtt SharedApiGateway.ApiEndpoint
  FrontendUrl:
    Description: Website URL of the frontend bucket (use as FrontendOrigin)
    Value: !GetAtt FrontendBucket.WebsiteURL