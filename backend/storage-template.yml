AWSTemplateFormatVersion: '2010-09-09'
Description: K-Seat persistent storage and static website buckets

Resources:
  KSeatS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: k-seat-object
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  KSeatS3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref KSeatS3Bucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub '${KSeatS3Bucket.Arn}/pictures/*'
          - Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub '${KSeatS3Bucket.Arn}/layouts/place/*/*.webp'

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: users
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: events
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
        - AttributeName: creatorId
          AttributeType: S
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: CreatorIndex
          KeySchema:
            - AttributeName: creatorId
              KeyType: HASH
            - AttributeName: eventId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST

  PlacesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: places
      AttributeDefinitions:
        - AttributeName: placeId
          AttributeType: S
      KeySchema:
        - AttributeName: placeId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  ReservationTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: reservations
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
        - AttributeName: seatId
          AttributeType: S
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH
        - AttributeName: seatId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: EmailIndex
          KeySchema:
            - AttributeName: email
              KeyType: HASH
            - AttributeName: eventId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'seat-reservation-frontend-${AWS::AccountId}'
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'

  SamDeploymentBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'seat-reservation-sam-artifacts-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

Outputs:
  KSeatS3BucketName:
    Description: Bucket used for event, place, and layout files
    Value: !Ref KSeatS3Bucket
  FrontendBucketName:
    Description: Static website bucket name
    Value: !Ref FrontendBucket
  FrontendUrl:
    Description: Static website URL
    Value: !GetAtt FrontendBucket.WebsiteURL
  SamDeploymentBucketName:
    Description: Private bucket for SAM deployment artifacts
    Value: !Ref SamDeploymentBucket
